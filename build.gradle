plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.datecourse'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.zaxxer:HikariCP:7.1.0'
    testImplementation 'com.h2database:h2:2.3.232'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // MySQL JDBC 드라이버
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // JSON 파싱 (공공데이터 및 카카오 API 응답 처리용)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

javafx {
    version = "21"
    // FXML 디자인 및 WebView(카카오 지도) 모듈 포함
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing']
}

application {
    mainClass = 'com.datecourse.app.AppLauncher'
}



test {
    useJUnitPlatform()
}

// Read the personal map key at runtime instead of packaging it in application archives.
processResources {
    doFirst { delete layout.buildDirectory.file('resources/main/db.properties').get().asFile }
    exclude 'map/kakao-config.js', 'db.properties'
    from('data/places/demo') {
        include 'seomyeon-jeonpo-demo.json'
        into 'datasets'
    }
}
tasks.named('jar') { exclude 'map/kakao-config.js', 'db.properties' }

tasks.register('runMapDemo', JavaExec) {
    group = 'application'
    description = 'Open the planner map without requiring a DB login'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.datecourse.demo.ConditionLauncher'
    jvmArgs = ['--module-path', classpath.asPath, '--add-modules', 'javafx.controls,javafx.fxml,javafx.web,javafx.swing']
}

tasks.register('runPlaceBindingDemo', JavaExec) {
    group = 'verification'
    description = 'Check confirmed pilot place IDs without an API call or DB connection'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.datecourse.demo.PlaceBindingDemo'
}

tasks.register('runPilotDemo', JavaExec) {
    group = 'application'
    description = 'Open the nine-place pilot planner without a member DB connection'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.datecourse.demo.PilotPlannerLauncher'
    jvmArgs = ['--module-path', classpath.asPath, '--add-modules', 'javafx.controls,javafx.fxml,javafx.web,javafx.swing']
}

// Provider keys are fetched at runtime, never copied into application resources.
// Overwrite old generated configuration too, so a rebuild removes previously embedded TMAP keys.
def tmapServiceResources = layout.buildDirectory.dir('generated/tmap-service-resources')
tasks.register('prepareTmapServiceConfig') {
    outputs.dir(tmapServiceResources)
    outputs.upToDateWhen { false }
    doLast {
        def destination = tmapServiceResources.get().file('tmap-service.properties').asFile
        destination.parentFile.mkdirs()
        destination.setText('tmap.app.key=\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(tmapServiceResources)
tasks.named('processResources') { dependsOn 'prepareTmapServiceConfig' }

// Real map integration runs in a separate worker from the WebView fixtures.
tasks.named('test') { exclude '**/WalkingRouteLiveTest.class' }
tasks.register('tmapLiveTest', Test) {
    group = 'verification'
    description = 'Verify the packaged TMAP service on the real Kakao map'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/WalkingRouteLiveTest.class'
    useJUnitPlatform()
    environment 'RUN_TMAP_LIVE_TEST', 'true'
}
