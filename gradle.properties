# Discover standard installations and optional environment-provided JDK locations.
# The Java 21 toolchain filters these candidates by version. No machine-specific paths.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JDK21_HOME,JAVA_HOME_21_X64,JAVA_HOME

# Provision the required Java 21 only when no matching local installation is found.
org.gradle.java.installations.auto-download=true
