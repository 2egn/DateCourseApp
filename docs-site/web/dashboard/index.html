<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작업 보드 · DateCourseApp</title><link rel="stylesheet" href="/dashboard/board.css"><script type="module" src="/dashboard/board.js"></script></head><body>
<header><a href="/">← 팀 문서</a><span>DateCourseApp / TEAM WORKSPACE</span></header>
<main><section class="heading"><div><p class="eyebrow">함께 만드는 다음 단계</p><h1>작업 보드</h1><p>기능 영역별로 할 일을 찾고, 진행 상황을 함께 관리해요.</p></div><button id="add">+ 작업 만들기</button></section>
<section class="summary" id="summary" aria-live="polite"></section>
<section class="toolbar"><div id="areas" class="chips" aria-label="기능 영역"></div><div class="filters"><input id="search" type="search" placeholder="제목 · 담당자 · 작업 번호 검색" aria-label="작업 검색"><select id="priority" aria-label="우선순위"><option value="">모든 우선순위</option><option value="high">높음</option><option value="normal">보통</option><option value="low">낮음</option></select><label><input id="archived" type="checkbox"> 보관함 포함</label><button id="refresh" class="secondary">새로고침</button></div></section>
<p id="message" role="status">작업을 불러오고 있어요…</p><section id="board" class="board" aria-label="진행 상태별 작업"></section><footer>팀원 공동 보드 · 약 30초마다 갱신 · 카드를 끌거나 상태 메뉴로 이동할 수 있어요.</footer></main>
<dialog id="editor"><form id="form"><div class="dialog-heading"><h2 id="dialog-title">작업 만들기</h2><button type="button" id="close" class="secondary" aria-label="닫기">✕</button></div><label>제목<input name="title" maxlength="100" required></label><div class="row"><label>상태<select name="status"></select></label><label>기능 영역<select name="area"></select></label><label>우선순위<select name="priority"></select></label></div><label>담당자 (GitHub 아이디)<input name="assignee" maxlength="39" placeholder="예: 2egn" pattern="[A-Za-z0-9][A-Za-z0-9-]{0,38}"></label><label>작업 설명<textarea name="description" maxlength="2000" rows="3"></textarea></label><label>완료 기준<textarea name="acceptance" maxlength="1000" rows="2"></textarea></label><label>선행 작업<input name="dependencies" maxlength="200" placeholder="예: DB-01"></label><label>관련 코드 노트<select name="relatedNote"><option value="">선택 안 함</option></select></label><p id="edit-error" role="alert"></p><div class="actions"><button type="button" id="archive" class="secondary">보관하기</button><button type="submit" id="save">저장</button></div></form></dialog>
</body></html>
