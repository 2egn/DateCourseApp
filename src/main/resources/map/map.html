<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>데이트 코스 지도</title>
    <link rel="stylesheet" href="./itinerary-rail.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body.course-capture #place-search, body.course-capture #map-status,
        body.course-capture #range-tooltip, body.course-capture #place-detail,
        body.course-capture #itinerary-rail, body.course-capture #route-controls,
        body.course-capture #route-image-overlay, body.course-capture #route-image-zoom,
        body.course-capture .walking-route-tooltip, body.course-capture .place-pin-preview {
            display: none !important;
        }

        body.course-capture #map-surface {
            flex: 1;
        }

        .course-capture-pin {
            display: flex;
            align-items: center;
            gap: 6px;
            width: max-content;
            max-width: 164px;
            padding: 4px 8px 4px 4px;
            background: #fff;
            border: 1px solid #e4d4db;
            border-radius: 22px;
            box-shadow: 0 2px 7px #15233b26;
            color: #253244;
            font: 600 13px/26px "Malgun Gothic", sans-serif;
            white-space: nowrap;
        }

        .course-capture-pin b {
            display: grid;
            place-items: center;
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            text-align: center;
            border-radius: 50%;
            background: #ed5675;
            color: white;
            font: 700 13px/1 "Malgun Gothic", sans-serif;
        }

        .course-capture-pin span {
            max-width: 112px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .course-capture-pin.is-origin b {
            background: #3476bd;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            font: 13px "Malgun Gothic", sans-serif;
            color: #191f28;
            background: white;
        }

        #place-search {
            position: relative;
            z-index: 30;
            flex: 0 0 auto;
            min-width: 0;
            border-bottom: 1px solid #eef0f3;
        }

        #search-popup {
            position: absolute;
            top: calc(100% - 5px);
            left: 16px;
            right: 16px;
            background: rgba(255, 255, 255, .98);
            border: 1px solid #e5e9ef;
            border-radius: 12px;
            box-shadow: 0 8px 24px #18294b26;
            overflow: hidden;
        }

        #search-form {
            padding: 8px 16px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        #place-query {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 6px 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            font: inherit;
            background: #f2f4f6;
            color: #191f28;
        }

        #place-query::placeholder {
            color: #6b7684;
        }

        #place-query:focus {
            outline: 2px solid #ffe3e8;
            border-color: #ff6b81;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        #search-submit {
            height: 36px;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 6px 12px;
            background: #ff6b81;
            color: #191f28;
            font-weight: bold;
        }

        #search-submit:hover {
            background: #ff8294;
        }

        #search-submit:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #search-close {
            height: 36px;
            border: 1px solid #dce1e8;
            border-radius: 8px;
            background: #f2f4f6;
            color: #334155;
            padding: 6px 12px;
        }

        [hidden] {
            display: none !important;
        }

        #search-message {
            margin: 0;
            padding: 10px 14px;
            color: #6b7684;
            font-size: 12px;
            line-height: 1.5;
        }

        #search-message:empty {
            display: none;
        }

        #search-results {
            position: relative;
            list-style: none;
            margin: 0;
            padding: 0 12px;
            max-height: 48vh;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        #search-results button {
            width: 100%;
            padding: 10px 4px;
            border: 0;
            border-top: 1px solid #eef0f3;
            background: white;
            text-align: left;
        }

        #search-results button:hover, #search-results button:focus, #search-results button[aria-selected="true"] {
            background: #fff2f5;
        }

        #search-results button[aria-selected="true"] {
            box-shadow: inset 3px 0 #ff6b81;
            outline: none;
        }

        .place-name, .place-address {
            display: block;
            overflow-wrap: anywhere;
        }

        .place-name {
            font-weight: bold;
        }

        .place-address {
            margin-top: 3px;
            color: #667085;
            font-size: 12px;
        }

        #map {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            position: relative;
        }

        #map-status {
            flex: 0 0 auto;
            margin: 0;
            padding: 10px 16px;
            border-top: 1px solid #eef0f3;
            color: #6b7684;
            font-size: 12px;
            line-height: 1.5;
        }






        /* =====================================================================
           지도 장소 상세 카드 크기와 버건디 테마
           ===================================================================== */


        /* 우측 상단 닫기(×) 버튼 위치 및 크기 축소 */
        #place-detail .detail-close {
            top: 10px !important;
            right: 10px !important;
            width: 26px !important;
            height: 26px !important;
            line-height: 24px !important;
            font-size: 16px !important;
            background: #F8F5EF !important;
            color: #4A1827 !important;
            border-radius: 8px !important;
        }
        #place-detail .detail-close:hover {
            background: #E9DFD2 !important;
        }

        /* 카테고리 & 장소명 크기 컴팩트화 */
        #place-detail .detail-topline {
            font-size: 11px !important;
            color: #7A263A !important;
            font-weight: bold !important;
            margin-bottom: 2px !important;
        }
        #place-detail #detail-title {
            font-size: 16px !important;
            color: #4A1827 !important;
            margin: 0 28px 8px 0 !important;
            line-height: 1.3 !important;
        }

        /* 가격/주소/세부분류 행 간격 축소 */
        #place-detail .detail-facts {
            margin: 0 0 6px 0 !important;
            gap: 4px 10px !important;
            font-size: 13px !important;
        }
        #place-detail .detail-facts dt {
            color: #65545A !important;
            font-weight: normal !important;
        }
        #place-detail .detail-facts dd {
            color: #4A1827 !important;
            font-weight: bold !important;
        }

        /* 부가 설명 문구 간격 축소 */
        #place-detail .detail-extra {
            font-size: 13px !important;
            color: #475569 !important;
            margin: 4px 0 8px 0 !important;
            line-height: 1.6 !important;
        }

        /* 하단 액션 버튼 영역 ('코스에 추가', '카카오맵에서 보기') */
        #place-detail .detail-actions {
            display: flex !important;
            gap: 8px !important;
            margin-top: 6px !important;
        }

        /* 분홍색으로 튀던 '코스에 추가' 버튼 -> 메인 버건디(#7A263A)로 통일 */
        #place-detail .detail-add {
            flex: 1 !important;
            min-height: 36px !important;
            height: auto !important;
            padding: 8px 10px !important;
            background: #7A263A !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: 9px !important;
            font-size: 12.5px !important;
            font-weight: bold !important;
        }
        #place-detail .detail-add:hover {
            background: #4A1827 !important;
        }

        /* '카카오맵에서 보기' 버튼 -> 연베이지 보조 버튼으로 통일 */
        #place-detail .detail-map-link {
            flex: 1 !important;
            min-height: 36px !important;
            height: auto !important;
            line-min-height: 36px !important;
            height: auto !important;
            padding: 8px 10px !important;
            background: #E9DFD2 !important;
            color: #4A1827 !important;
            border: none !important;
            border-radius: 9px !important;
            font-size: 13px !important;
            font-weight: bold !important;
            text-align: center !important;
            text-decoration: none !important;
        }
        #place-detail .detail-map-link:hover {
            background: #dfd2c0 !important;
        }

        /* 맨 아래 '정보 정정 제보' & 참고 안내 한 줄로 컴팩트 정리 */
        #place-detail .detail-report {
            display: inline-block !important;
            margin-top: 6px !important;
            font-size: 11px !important;
            color: #7A263A !important;
        }
        #place-detail .detail-note {
            display: inline-block !important;
            margin: 6px 0 0 8px !important;
            font-size: 11px !important;
            color: #65545A !important;
        }

        /* 지도 상단 검색 버튼(#search-submit)도 분홍색 대신 버건디로 통일 */
        #search-submit {
            background: #7A263A !important;
            color: #FFFFFF !important;
        }
        #search-submit:hover {
            background: #4A1827 !important;
        }
    </style>
</head>
<body>
<section id="place-search" aria-label="출발 장소 검색">
    <form id="search-form" role="search">
        <label for="place-query" class="sr-only">부산 출발 장소 검색</label>
        <div class="search-row">
            <input id="place-query" type="search" maxlength="100"
                   placeholder="출발 장소 검색 · 서면역, 광안리"
                   autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false"
                   aria-controls="search-results" aria-describedby="search-message">
            <button id="search-submit" type="submit" disabled>검색</button>
            <button id="search-close" type="button" hidden aria-label="검색 결과 닫기">닫기</button>
        </div>
    </form>
    <div id="search-popup" hidden>
        <p id="search-message" role="status" aria-live="polite"></p>
        <ul id="search-results" role="listbox" aria-label="장소 검색 결과"></ul>
    </div>
</section>
<div id="map-surface">
    <div id="map"><div id="map-canvas"></div></div>
    <section id="route-controls" hidden aria-label="지도 보기와 구간 안내">
        <div id="route-view-toolbar" aria-label="코스 보기 방식">
            <div class="route-view-buttons">
                <button id="route-map-button" type="button" aria-pressed="true">지도 보기</button>
                <button id="route-image-button" type="button" aria-pressed="false">이미지 보기</button>
            </div>
        </div>
        <section id="walking-panel" hidden aria-label="구간 안내">
            <div id="walking-summary" class="sr-only" role="status" aria-live="polite"></div>
            <div id="walking-label">구간 안내</div>
            <div id="walking-leg-list" role="group" aria-label="구간 안내 선택"></div>
            <details id="walking-details" hidden>
                <summary>선택 구간 안내</summary>
                <div id="walking-detail-heading" class="walking-detail-heading"></div>
                <div id="walking-detail-facts" class="walking-detail-facts"></div>
                <ol id="walking-directions"></ol>
            </details>
        </section>
    </section>
    <div id="route-image-overlay" hidden aria-label="경로 이미지">
        <img id="route-image" alt="코스 이동 경로 지도 이미지" role="button" tabindex="0" title="이미지 크게 보기"
             aria-label="이미지를 눌러 크게 보기">
    </div>
    <div id="range-tooltip" role="tooltip" hidden></div>
    <section id="itinerary-rail" class="itinerary-rail" aria-label="코스와 주변 장소 탐색" hidden>
        <div class="planner-tabs" role="tablist" aria-label="장소 목록">
            <button id="course-tab" role="tab" aria-selected="true" aria-controls="itinerary-viewport" type="button">추천
                코스
            </button>
            <button id="nearby-tab" role="tab" aria-selected="false" aria-controls="itinerary-viewport" type="button">주변
                장소
            </button>
        </div>
        <header class="itinerary-heading"><strong><span id="itinerary-title">오늘의 코스</span> <span
                id="itinerary-count"></span></strong><small id="itinerary-hint">스크롤로 탐색 · 선택된 카드를 눌러 상세</small></header>
        <div id="itinerary-empty" class="itinerary-empty" hidden></div>
        <div id="itinerary-viewport" class="itinerary-viewport" role="listbox" aria-label="방문 순서"
             aria-orientation="vertical">
            <ol id="itinerary-list" class="itinerary-list" role="presentation"></ol>
        </div>
    </section>
    <section id="place-detail" class="place-detail" role="region" aria-labelledby="detail-title" aria-hidden="true"
             hidden>
        <button id="detail-close" class="detail-close" type="button" aria-label="장소 상세 닫기" tabindex="-1">×</button>
        <div id="detail-category" class="detail-topline"></div>
        <h2 id="detail-title"></h2>
        <dl id="detail-facts" class="detail-facts"></dl>
        <div id="detail-extra" class="detail-extra"></div>
        <div class="detail-actions">
            <button id="detail-add" class="detail-add" type="button" hidden tabindex="-1">코스에 추가</button>
            <a id="detail-map-link" class="detail-map-link" target="_blank" rel="noopener noreferrer" tabindex="-1">카카오맵에서
                보기 ↗</a></div>
        <a id="detail-report" class="detail-report" href="#report-information" tabindex="-1">정보 정정 제보</a>
        <p class="detail-note">가격·평점은 참고 정보예요.</p>
    </section>
    <style>
        #walking-panel {
            position: static;
            width: max-content;
            max-width: 100%;
            margin-top: 4px;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            font-size: 12px;
            color: #1e3a5f;
        }

        #walking-summary {
            font-weight: 600;
        }

        #walking-leg-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 0;
        }

        #walking-label {
            margin: 0 0 4px 4px;
            color: #a52950;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.2;
        }

        .walking-leg-button {
            display: grid;
            place-items: center;
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            border: 1px solid #d9e0e8;
            border-radius: 50%;
            padding: 0;
            background: #fff;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .walking-leg-button[aria-pressed="true"] {
            border-color: #a52950;
            background: #a52950;
            color: #fff;
            box-shadow: 0 2px 6px #a5295040;
        }

        .walking-route-tooltip {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            width: 360px;
            white-space: normal;
            word-break: keep-all;
            overflow-wrap: break-word;
            background: #fff;
            color: #253244;
            padding: 14px 16px;
            border: 1px solid #dce2ea;
            border-radius: 12px;
            box-shadow: 0 6px 20px #18294b26;
            font: 13px/1.7 "Malgun Gothic", sans-serif;
            pointer-events: auto;
            overflow: auto;
        }

        .walking-tooltip-title {
            flex: 0 0 auto;
            min-width: 0;
            white-space: normal;
            overflow-wrap: break-word;
            color: #191f28;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.6;
        }

        .walking-tooltip-steps {
            flex: 0 1 auto;
            min-height: 0;
            margin: 12px 0 0;
            padding: 0 8px 0 26px;
            max-height: 260px;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            border-top: 1px solid #eef0f3;
            white-space: normal;
        }

        .walking-tooltip-steps li {
            padding: 9px 0 9px 3px;
            margin: 0;
            border-bottom: 1px solid #eef0f3;
            white-space: normal;
            overflow-wrap: break-word;
            color: #253244;
        }

        .walking-tooltip-steps li:last-child {
            border-bottom: 0;
        }

        .walking-tooltip-steps:focus-visible {
            outline: 2px solid #99b8e0;
            outline-offset: 2px;
            border-radius: 4px;
        }

        .walking-tooltip-facts {
            flex: 0 0 auto;
            margin-top: 5px;
            color: #526174;
            font-size: 13px;
            white-space: normal;
        }

        .walking-route-tooltip.is-detailed {
            position: relative;
        }

        .walking-route-tooltip.is-detailed .walking-tooltip-title {
            padding-right: 26px;
        }

        .walking-tooltip-hint {
            margin-top: 6px;
            color: #64748b;
            font-size: 12px;
        }

        .walking-tooltip-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: #f2f4f6;
            color: #526174;
            font-size: 20px;
            line-height: 28px;
        }

        .walking-route-tooltip::-webkit-scrollbar, .walking-tooltip-steps::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .walking-route-tooltip::-webkit-scrollbar-thumb, .walking-tooltip-steps::-webkit-scrollbar-thumb {
            background: #b9c4d1;
            border-radius: 6px;
        }

        .walking-route-tooltip::-webkit-scrollbar-track, .walking-tooltip-steps::-webkit-scrollbar-track {
            background: transparent;
        }

        .walking-leg-badge {
            border: 2px solid white;
            border-radius: 14px;
            min-width: 26px;
            height: 26px;
            padding: 0 5px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 1px 4px #0003;
        }

        #walking-panel details {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 72;
            width: min(360px, calc(100vw - 24px));
            max-height: min(48vh, 360px);
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            padding: 11px 18px 11px 13px;
            border: 1px solid #dbe2eb;
            border-radius: 11px;
            background: rgba(255,255,255,.98);
            box-shadow: 0 5px 18px #1e293b24;
            scrollbar-width: none;
        }

        #walking-panel details::-webkit-scrollbar { display: none; width: 0; height: 0; }

        #walking-panel summary {
            cursor: pointer;
        }

        .walking-detail-heading { margin-top: 8px; font-weight: 700; color: #253244; }
        .walking-detail-facts { margin-top: 4px; color: #526174; line-height: 1.5; }

        #walking-directions {
            max-height: none;
            overflow: visible;
            margin: 6px 0 0;
            padding: 0 8px 0 24px;
            list-style: none;
        }

        #walking-directions li {
            margin: 4px 0;
            line-height: 1.5;
        }

    </style>
</div>
<div id="route-image-zoom" hidden role="dialog" aria-modal="true" aria-label="경로 이미지 크게 보기">
    <button id="route-image-zoom-close" type="button" aria-label="크게 보기 닫기">×</button>
    <img id="route-image-zoomed" alt="코스 이동 경로 지도 이미지 크게 보기">
</div>
<div id="map-status" role="status" aria-live="polite">지도를 불러오고 있어요…</div>
<script src="./kakao-config.js"></script>
<script src="./itinerary-rail.js"></script>
<script src="./instant-zoom.js"></script>
<script src="./pin-pointer-gesture.js"></script>
<script src="./map-viewport.js"></script>
<script src="./camera-motion.js"></script>
<script src="./map.js"></script>
<script>
    (function () {
        const controls = document.getElementById('route-controls');
        const toolbar = document.getElementById('route-view-toolbar');
        const overlay = document.getElementById('route-image-overlay');
        const image = document.getElementById('route-image');
        const zoom = document.getElementById('route-image-zoom');
        const zoomedImage = document.getElementById('route-image-zoomed');
        const mapButton = document.getElementById('route-map-button');
        const imageButton = document.getElementById('route-image-button');
        let courseKey = null, zoomOpener = null;
        window.routeImageRequestVersion = 0;
        function invalidateImage() {
            window.routeImageRequestVersion++;
            selectView(false);
            image.removeAttribute('src');
            zoomedImage.removeAttribute('src');
            toolbar.style.visibility = '';
        }
        window.setRouteImageCourse = function (plan) {
            const nextKey = JSON.stringify(plan);
            if (courseKey === nextKey) return;
            courseKey = nextKey;
            invalidateImage();
        };
        function selectView(isImage) {
            overlay.hidden = !isImage;
            mapButton.setAttribute('aria-pressed', String(!isImage));
            imageButton.setAttribute('aria-pressed', String(isImage));
            if (!isImage) closeZoom(false);
        }
        mapButton.addEventListener('click', function () {
            window.routeImageRequestVersion++;
            selectView(false);
            requestAnimationFrame(function () {
                if (window.fitConfirmedCourseView) window.fitConfirmedCourseView();
            });
        });
        imageButton.addEventListener('click', function () {
            window.routeImageRequestVersion++;
            if (window.javaMapBridge) window.javaMapBridge.requestRouteImage();
        });
        function openZoom() {
            if (!image.src) return;
            zoomOpener = document.activeElement;
            zoomedImage.src = image.src;
            zoom.hidden = false;
            document.getElementById('route-image-zoom-close').focus();
        }
        // 확대 창을 닫으면 숨은 닫기 버튼 대신 원래 이미지로 돌아간다.
        function closeZoom(returnFocus) {
            if (zoom.hidden) return;
            const focusedInside = zoom.contains(document.activeElement);
            zoom.hidden = true;
            if (returnFocus !== false) {
                const target = zoomOpener && zoomOpener !== document.body && zoomOpener.isConnected
                    && zoomOpener.getClientRects().length ? zoomOpener : image;
                target.focus();
                if (document.activeElement !== target) image.focus();
            } else if (focusedInside) mapButton.focus();
            zoomOpener = null;
        }
        image.addEventListener('click', openZoom);
        image.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openZoom(); }
        });
        zoom.addEventListener('click', closeZoom);
        document.getElementById('route-image-zoom-close').addEventListener('click', closeZoom);
        zoom.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeZoom(); }
            if (event.key === 'Tab') {
                event.preventDefault();
                document.getElementById('route-image-zoom-close').focus();
            }
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && !zoom.hidden) closeZoom();
        });
        let externalViewControls=false,routeControlsVisible=false;
        window.refreshRouteControls=function(){controls.hidden=!routeControlsVisible || externalViewControls && document.getElementById('walking-panel').hidden;};
        window.setExternalRouteViewControls=function(enabled){externalViewControls=!!enabled;toolbar.hidden=!!enabled;controls.style.top=enabled?'58px':'';window.refreshRouteControls();};
        window.setRouteViewVisible = function (visible) {
            routeControlsVisible=!!visible; window.refreshRouteControls();
            if (!visible) invalidateImage();
        };
        window.prepareRouteImageCapture = function () {
            selectView(false);
            toolbar.style.visibility = 'hidden';
        };
        window.showRouteImage = function (dataUrl, requestVersion) {
            if (requestVersion !== undefined && requestVersion !== window.routeImageRequestVersion) return;
            image.src = dataUrl;
            zoomedImage.src = dataUrl;
            toolbar.style.visibility = '';
            selectView(true);
        };
        window.routeImageFailed = function () { toolbar.style.visibility = ''; };
    }());
</script>
</body>
</html>
