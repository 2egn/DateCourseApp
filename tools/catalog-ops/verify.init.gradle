gradle.projectsEvaluated {
    def app = gradle.rootProject
    app.sourceSets.test.java.srcDir(app.file('tools/catalog-ops'))
    app.tasks.register('verifyCatalogExpansion', JavaExec) {
        group = 'verification'
        dependsOn app.tasks.testClasses
        classpath = app.sourceSets.test.runtimeClasspath
        mainClass = 'com.datecourse.db.ExpansionAudit'
        ['placeBaseline','placeBaselineFacts','placeDataset','placeFacts','placeReport'].each { key ->
            if (!app.hasProperty(key)) throw new GradleException("${key} is required")
        }
        args app.findProperty('placeExpansionMode') ?: 'preflight',
            app.property('placeBaseline'), app.property('placeBaselineFacts'),
            app.property('placeDataset'), app.property('placeFacts'), app.property('placeReport')
    }
}
gradle.projectsEvaluated {
    def app=gradle.rootProject
    app.tasks.register('rehearseCatalogExpansion', JavaExec) {
        group='verification'
        dependsOn app.tasks.testClasses
        classpath=app.sourceSets.test.runtimeClasspath
        mainClass='com.datecourse.db.ExpansionRehearsal'
        args app.property('placeBaseline'),app.property('placeBaselineFacts'),app.property('placeDataset'),app.property('placeFacts'),app.property('placeScenarios'),app.property('placeReport')
        if(app.findProperty('placeRehearsalMode')=='price-update') args 'price-update'
    }
}

// 기존 추천 조건만 사용하며 경로 공급사 API와 DB는 호출하지 않는다.
gradle.projectsEvaluated {
    def app=gradle.rootProject
    app.tasks.register('exploreCatalogRoutes', JavaExec) {
        group='verification'
        dependsOn app.tasks.testClasses
        classpath=app.sourceSets.test.runtimeClasspath
        mainClass='com.datecourse.db.RouteResourceProbe'
        args app.property('placeDataset'),app.property('placeFacts'),app.property('placeRehearsal'),app.property('placeScenarios'),app.property('placeReport')
    }
}
